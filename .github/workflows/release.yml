name: Release

# Builds the minimal-files zip and publishes a GitHub release for a v* tag.
# Forgejo is the source of truth: it auto-tags on main pushes (see .forgejo/workflows/release.yml)
# and its push-mirror replicates the tag here, triggering this workflow. workflow_dispatch lets you
# rebuild a chosen tag manually.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release zip
        shell: pwsh
        run: ./build/New-Release.ps1 -OutputDir dist -Version "${{ github.ref_name }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
